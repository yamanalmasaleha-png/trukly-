name: Truckly Source Review
on:
  pull_request:
  push:
    branches:
      - main
      - review/v77-pager-demo-and-source-sync
      - reconcile/v77-pager-ux-and-debug-workbench
      - harden/**

permissions:
  contents: read

jobs:
  pager-and-source-syntax:
    name: Pager demo + source syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact 27 Hatchable API route files (no stray helpers in api/)
        shell: bash
        run: |
          count=$(find api -type f -name '*.js' | wc -l | tr -d ' ')
          echo "Found $count route files in api/"
          test "$count" = "27"
      - name: Check Hatchable API and shared lib ESM syntax
        shell: bash
        run: |
          find api lib -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check --input-type=module < "$f"
          done
      - name: Check browser script syntax
        shell: bash
        run: |
          find public -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Pager demo safety smoke test
        run: node tests/pager-demo.test.cjs

  catalog-compatibility:
    name: Reconciled catalog & UX safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run listing, UX, API parity & Owner Mode checks
        run: node tests/listing-verification.cjs

  postgres-backend-hardening:
    name: Real PostgreSQL RBAC, booking & community RLS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pg client in isolated runner temp directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pg-client"
          npm --prefix "$RUNNER_TEMP/pg-client" install --no-save --no-audit --no-fund pg@8
      - name: Run real-PostgreSQL backend hardening integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
          TRUCKLY_PG_NODE_MODULES: ${{ runner.temp }}/pg-client/node_modules
        run: node tests/backend-hardening.integration.cjs
