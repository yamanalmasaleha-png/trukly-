name: BiteShark Source & Runtime Verification
on:
  pull_request:
  push:
    branches:
      - main
      - review/v77-pager-demo-and-source-sync
      - reconcile/v77-pager-ux-and-debug-workbench
      - harden/**
      - improve/**
      - migrate/**
      - working/**
      - testing/**
      - feature/**
      - fix/**
      - chore/**
      - antigravity/**
      - integrate/**

permissions:
  contents: read

jobs:
  pager-and-source-syntax:
    name: Pager demo + source syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify VPS domain route inventory (no stray helpers or staging probes in api/)
        shell: bash
        run: |
          count=$(find api -type f -name '*.js' | wc -l | tr -d ' ')
          echo "Found $count route files in api/"
          test "$count" = "30"
          ! find api -type f -name '*probe*' -o -name '*debug*' | grep -q .
      - name: Check VPS handlers, server, shared libraries, and staging diagnostics syntax
        shell: bash
        run: |
          find api lib server packages scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check --input-type=module < "$f"
          done
      - name: Check browser script syntax
        shell: bash
        run: |
          find public -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check deployment shell scripts syntax
        shell: bash
        run: |
          bash -n deploy/install-staging-release.sh
          bash -n deploy/backup/truckly-staging-backup.sh
          bash -n deploy/bin/biteshark-staging2-ctl
      - name: VPS-only platform contract
        run: node tests/vps-platform-contract.test.cjs
      - name: Pager demo safety smoke test
        run: node tests/pager-demo.test.cjs
      - name: Map provider allowlist, HTTPS & fail-safe config unit suite
        run: node tests/map-resilience.test.cjs
      - name: Staging2 scoped helper validation, path isolation & log redaction unit suite
        run: node tests/staging2-ctl-security.test.cjs

  code-registry-and-handbook:
    name: Code registry, handbook links, determinism & change-impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run code-registry parser, fixture, exclusion, comparison & determinism tests
        run: node tests/code-registry.test.cjs
      - name: Validate handbook links, schemas, determinism & structural drift gate
        run: node tools/code-registry/cli.mjs validate
      - name: Build timestamped registry snapshot & merge-base change-impact report
        shell: bash
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p /tmp/bs-registry-artifacts
          node tools/code-registry/cli.mjs scan --out /tmp/bs-registry-artifacts/registry-full-snapshot.json --include-timestamp
          BASE_REF="HEAD~1"
          if [ -n "$PR_BASE_REF" ] && git rev-parse --verify "origin/$PR_BASE_REF^{commit}" >/dev/null 2>&1; then
            BASE_REF="origin/$PR_BASE_REF"
          elif git rev-parse --verify "origin/working/biteshark-vps^{commit}" >/dev/null 2>&1; then
            BASE_REF="origin/working/biteshark-vps"
          fi
          if git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            node tools/code-registry/cli.mjs compare --base "$BASE_REF" --head HEAD --merge-base --format markdown --out /tmp/bs-registry-artifacts/change-impact.md
            node tools/code-registry/cli.mjs compare --base "$BASE_REF" --head HEAD --merge-base --format json --out /tmp/bs-registry-artifacts/change-impact.json
          fi
      - name: Upload code-registry & change-impact artifact
        uses: actions/upload-artifact@v4
        with:
          name: biteshark-code-registry-impact
          path: /tmp/bs-registry-artifacts/
          retention-days: 14

  catalog-compatibility:
    name: Reconciled catalog & UX safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run listing, UX, API parity & Owner Mode checks
        run: node tests/listing-verification.cjs

  postgres-backend-hardening:
    name: Real PostgreSQL RBAC, booking & community RLS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies via npm ci
        run: npm ci --no-audit --no-fund
      - name: Cross-verify reconstructed SQL schema & RLS against disposable PostgreSQL 16
        env:
          BITESHARK_REGISTRY_VERIFY_PG_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tools/code-registry/cli.mjs validate --verify-db
      - name: Run standalone runtime, OTP auth, concurrency, CSRF & proxy integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/standalone-runtime-auth.integration.cjs
      - name: Run authentication email delivery, provider diagnostics, DNS readiness & UI contract suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/auth-email-delivery.integration.cjs
      - name: Run BiteShark two-tier admin portal, onboarding, invitations, moderation, issues & viewpoints PostgreSQL suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/admin-governance.integration.cjs
      - name: Run BiteShark legal-policy drafts, 14+ age eligibility & compliance readiness PostgreSQL suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/legal-readiness.integration.cjs
      - name: Run BiteShark controlled feature management, worker recheck, dependency DAG & CLI recovery PostgreSQL suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/feature-controls.integration.cjs
      - name: Run BiteShark account invitation workflow, Resend delivery, idempotency & narrow staging eligibility PostgreSQL suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/invitation-workflow.integration.cjs
      - name: Run BiteShark operational diagnostics, redaction, release attribution, RBAC & retention PostgreSQL suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/diagnostics-and-reliability.integration.cjs
      - name: Run BiteShark Support & Feedback + Connected Diagnostics PostgreSQL integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/support-feedback.integration.cjs
      - name: Run deployment installer archive-safety, concurrency & service-failure rollback suite on Linux
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/install-staging-release.test.cjs
      - name: Validate standalone VPS staging gate runner, SQL bootstrap, probe & cleanup pre-flight
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/vps-staging-gates.cjs --preflight-local
      - name: Run real-PostgreSQL backend hardening & FOR SHARE permission-lock concurrency suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/backend-hardening.integration.cjs
      - name: Run P1 unified discovery & owner publishing PostgreSQL integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/p1-unified-discovery.integration.cjs
      - name: Run pager notifications outbox, worker lease fencing, pre-dispatch recheck, catch-up & config suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/pager-notifications.integration.cjs
      - name: Run real headless Chrome + PostgreSQL discovery & OTP sign-in browser E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/discovery-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL pager notification browser E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/pager-notifications-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Admin Portal & Role Experiences E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/admin-portal-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Legal Policy, Accessibility, 14+ Signup & Readiness E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/legal-readiness-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Controlled Feature Management & Open-Tab Sync E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/feature-controls-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Map Tile Referrer, Provider Config & Outage Resilience E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/map-resilience-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Account Invitation Workflow & Zero-Query-String Token E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/invitation-workflow-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Reliability, Accessible Feedback & Error Diagnostics Portal E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/reliability-accessibility-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Support & Feedback + Connected Diagnostics E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/support-feedback-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark First-Visit Welcome, Vendor Intro & Bypass Rules E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/welcome-experience-browser.e2e.cjs
      - name: Run real PostgreSQL BiteShark Urgent Pre-Pilot Security & Concurrency Integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/urgent-pilot-security.integration.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Shared-Device Sign-Out Isolation E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/urgent-pilot-security-browser.e2e.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Discovery Cards UX, Media Slot, Zoom & Accessibility E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/discovery-cards-ux-browser.e2e.cjs
      - name: Run real PostgreSQL + Sharp BiteShark Customer Exploration, Visit Journal, Photos & Trails Integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/customer-exploration.integration.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Customer Exploration, Legacy Migration & Feature Controls E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/customer-exploration-browser.e2e.cjs
      - name: Run real PostgreSQL + Sharp BiteShark Customer Profile, Greatest Hits, Unlisted Sharing & Moderation Integration suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/customer-profile-sharing.integration.cjs
      - name: Run real headless Chrome + PostgreSQL BiteShark Customer Profile, Greatest Hits & Unlisted Sharing E2E suite
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
        run: node tests/customer-profile-browser.e2e.cjs
      - name: Verify clean Linux release archive installation, startup, BiteShark assets & SIGTERM shutdown
        shell: bash
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          set -euo pipefail
          ART_DIR="$(mktemp -d)"
          INSTALL_DIR="$(mktemp -d)"
          META="$(node scripts/build-linux-release-tarball.cjs --ref HEAD --out-dir "$ART_DIR")"
          echo "$META"
          TARBALL="$(node -e 'console.log(JSON.parse(process.argv[1]).tarball_path)' "$META")"
          SHA="$(node -e 'console.log(JSON.parse(process.argv[1]).commit_sha)' "$META")"
          (cd "$ART_DIR" && sha256sum -c "$(basename "$TARBALL").sha256")
          tar -xzf "$TARBALL" -C "$INSTALL_DIR"
          ! find "$INSTALL_DIR" -maxdepth 3 \( -name '.env*' -o -name 'debug-admin.js' -o -name 'dev-server.cjs' -o -name 'tests' \) | grep -q .
          (cd "$INSTALL_DIR" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bs_clean_mig LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'mig_pw_ci_linux';
          CREATE ROLE bs_clean_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'app_pw_ci_linux';
          CREATE DATABASE bs_clean_linux OWNER bs_clean_mig TEMPLATE template0;
          SQL
          (
            cd "$INSTALL_DIR"
            MIGRATION_DATABASE_URL="postgres://bs_clean_mig:mig_pw_ci_linux@127.0.0.1:5432/bs_clean_linux" \
              node scripts/run-migrations.cjs --app-role bs_clean_app
          )
          PORT=4199 \
          HOST=127.0.0.1 \
          DATABASE_URL="postgres://bs_clean_app:app_pw_ci_linux@127.0.0.1:5432/bs_clean_linux" \
          BITESHARK_ENV=staging \
          BITESHARK_RELEASE_SHA="$SHA" \
          BITESHARK_PUBLIC_ORIGIN="https://staging.biteshark.live" \
          BITESHARK_TRUST_PROXY=none \
          BITESHARK_AUTH_SECRET="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
          BITESHARK_AUTH_DELIVERY_MODE=disabled \
            node "$INSTALL_DIR/server/index.js" &
          SRV_PID=$!
          trap 'kill -TERM "$SRV_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4199/api/healthz >/tmp/bs_health.json 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          grep -q "\"status\":\"ok\"" /tmp/bs_health.json
          grep -q "\"release_sha\":\"$SHA\"" /tmp/bs_health.json
          curl -fsS http://127.0.0.1:4199/ | grep -q "BiteShark"
          curl -fsS http://127.0.0.1:4199/policies/terms.html | grep -q "\[LEGAL OPERATOR NAME\], doing business as BiteShark"
          curl -fsS http://127.0.0.1:4199/manifest.json | grep -q "\"short_name\": \"BiteShark\""
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4199/icon-192.png)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4199/debug-admin.js)" = "404"
          kill -TERM "$SRV_PID"
          wait "$SRV_PID"
          trap - EXIT
          rm -rf "$ART_DIR" "$INSTALL_DIR" /tmp/bs_health.json
