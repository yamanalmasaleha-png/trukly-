<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Truckly</title><link rel="stylesheet" href="/theme.css"><style>body{overflow:auto;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#ffd9d1,transparent 30%),radial-gradient(circle at 90% 80%,#d3f2e6,transparent 35%),#fff9ed}.login-card{width:min(100%,430px);background:white;padding:30px;border-radius:30px;box-shadow:var(--shadow)}.login-logo{display:grid;place-items:center;width:65px;height:65px;border-radius:22px;background:var(--coral);color:white;font:700 37px Fredoka;transform:rotate(-4deg)}.login-card h1{font-size:32px;margin-top:20px}.login-card p{color:var(--muted)}.login-card button{margin-top:10px}.code{font-size:25px;letter-spacing:8px;text-align:center}.back{border:0;background:transparent;color:var(--muted);margin-bottom:5px}.error{color:#b33;font-size:12px}.passkey-offer{background:#eef9f5;padding:15px;border-radius:17px;margin-top:15px}</style></head><body><main class="login-card"><div class="login-logo">T</div><div id="emailStep"><small>YOUR FAVORITES ARE WAITING</small><h1>Roll back in</h1><p>Sign in to save trucks, manage bookings, and get nearby alerts.</p><form onsubmit="send(event)"><label>Email address<input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required></label><button class="primary" id="sendBtn">Email me a code →</button></form></div><div id="codeStep" hidden><button class="back" onclick="back()">← Use another email</button><h1>Check your inbox</h1><p>Enter the 6-digit code we sent to <b id="emailLabel"></b>.</p><form onsubmit="verify(event)"><label>Verification code<input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label><button class="primary">Sign in →</button></form></div><div id="passkeyOffer" class="passkey-offer" hidden><h2>Make next time instant</h2><p>Add a passkey to sign in with Face ID, fingerprint, or your screen lock.</p><button class="primary" onclick="addPasskey()">Add a passkey</button><button class="secondary" onclick="finish()">Not now</button></div><p id="error" class="error"></p></main><script>let email='',hasPasskey=false;const next=(()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')?n:'/'})();async function send(e){e.preventDefault();error.textContent='';email=document.getElementById('email').value;try{const r=await hatchable.auth.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&hatchable.auth.supportsPasskeys()){try{await hatchable.auth.signInWithPasskey({email});return location.href=next}catch{}}emailLabel.textContent=email;emailStep.hidden=true;codeStep.hidden=false;code.focus()}catch(x){error.textContent=x.message||'Could not send a code. Please try again.'}}async function verify(e){e.preventDefault();try{await hatchable.auth.verifyCode({email,code:code.value});if(!hasPasskey&&hatchable.auth.supportsPasskeys()&&localStorage.getItem('passkey_offer_declined')!=='1'){codeStep.hidden=true;passkeyOffer.hidden=false}else finish()}catch(x){error.textContent=x.message||'That code did not work.'}}async function addPasskey(){const saved=await hatchable.auth.registerPasskey({name:'My Truckly passkey'}).catch(()=>null);if(!saved)localStorage.setItem('passkey_offer_declined','1');finish()}function finish(){localStorage.setItem('passkey_offer_declined','1');location.href=next}function back(){codeStep.hidden=true;emailStep.hidden=false;error.textContent=''}</script></body></html>
